# config.yaml
nvd:
  api_key: "<<you nvd key>>"  # Get from https://nvd.nist.gov/developers/request-an-api-key
  rate_limit: 5  # requests per second

github:
  token: "<<your Github>>"  # GitHub personal access token
  timeout: 10  # seconds

scoring:
  weights:
    activity: 30
    trust: 20
    security: 35
    community: 15
  thresholds:
    critical: 90
    high: 80
    medium: 70
    low: 60

risk:
  high_risk_countries: ["CN", "RU", "IR", "KP", "SY"]
  critical_apps: ["payment", "auth", "database"]
  maintainer_risk_multipliers:
    corporate: 1.0
    verified_individual: 1.2
    anonymous: 1.5

# EPSS (Exploit Prediction Scoring System) — enriches each CVE with its
# probability of being exploited in the wild (0-1 score from FIRST.org).
# No API key required.  Deduction thresholds mirror _EPSS_*_THRESHOLD constants.
epss:
  enabled: true
  timeout: 10          # seconds per batch request
  high_threshold: 0.5  # ≥ this → actively weaponised   → -15 pts per CVE
  med_threshold: 0.1   # ≥ this → moderate risk          → -8 pts per CVE
                       # < med  → theoretical            → -2 pts per CVE

# OpenSSF Scorecard — fetches a 0-10 security posture score for GitHub repos.
# Set enabled: false to skip this API call.
scorecard:
  enabled: true
  timeout: 10  # seconds

# Contributor geolocation — resolves maintainer locations to country codes and
# applies geo-political risk weighting to the trust score.
# Nominatim (OpenStreetMap) is used as a free fallback geocoder; set a
# descriptive user_agent so OSM can contact you if needed.
geocoding:
  enabled: true
  max_contributors: 10        # number of top contributors to analyse
  nominatim_url: "https://nominatim.openstreetmap.org"
  user_agent: "OSSPolicyGuard/1.0 (opensource-policy-guard)"
